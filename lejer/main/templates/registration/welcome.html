{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url={% url 'admin_dashboard' %}">
    <title>Welcome | Lejer School Supplies</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(25, 135, 84, .18), transparent 24rem),
                radial-gradient(circle at 80% 10%, rgba(13, 110, 253, .2), transparent 24rem),
                linear-gradient(135deg, #f8fbff 0%, #e9eef5 100%);
        }

        .welcome-shell {
            min-height: 100vh;
        }

        .welcome-card {
            width: min(100%, 560px);
            border: 0;
            border-radius: 8px;
            animation: welcomeIn .7s ease-out both;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #198754;
            color: #fff;
            animation: iconPulse 1.8s ease-in-out infinite;
        }

        .brand-title {
            animation: textSlide .65s ease-out .2s both;
        }

        .welcome-message {
            animation: textSlide .65s ease-out .55s both;
        }

        .loading-bar {
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: #d8e1ea;
        }

        .loading-bar span {
            display: block;
            width: 100%;
            height: 100%;
            background: #0d6efd;
            transform-origin: left;
            animation: loadForward 3s linear both;
        }

        @keyframes welcomeIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes textSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(25, 135, 84, 0);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 16px 34px rgba(25, 135, 84, .24);
            }
        }

        @keyframes loadForward {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .welcome-card,
            .brand-icon,
            .brand-title,
            .welcome-message,
            .loading-bar span {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="welcome-shell d-flex align-items-center justify-content-center p-3">
        <section class="welcome-card card shadow-lg text-center">
            <div class="card-body p-4 p-sm-5">
                <div class="brand-icon mb-4">
                    <i class="bi bi-backpack4 fs-2"></i>
                </div>
                <h1 class="brand-title display-6 fw-bold mb-2">Lejer School Supplies</h1>
                <p class="welcome-message fs-5 text-muted mb-4">
                    Welcome, {{ request.user.username }}. Preparing your dashboard...
                </p>
                <div class="loading-bar" aria-hidden="true">
                    <span></span>
                </div>
            </div>
        </section>
    </main>
    <script>
        window.setTimeout(function () {
            window.location.href = "{% url 'admin_dashboard' %}";
        }, 3000);
    </script>
</body>
</html>
