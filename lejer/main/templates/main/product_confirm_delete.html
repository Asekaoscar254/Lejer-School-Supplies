{% extends 'main/base.html' %}

{% block header %}Delete Product{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-7 col-xl-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h2 class="h5">Delete {{ product.name }}?</h2>
                <p class="text-muted mb-4">
                    This will also remove any batches attached to SKU <code>{{ product.sku }}</code>.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Delete Product
                        </button>
                        <a href="{% url 'inventory' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
